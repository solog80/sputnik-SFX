# Supervisor Configuration for Sputnik and Stream Monitoring Services

[program:sputnik]
command=/path/to/sputnik_executable
autostart=true
autorestart=true
stderr_logfile=/var/log/sputnik.err.log
stdout_logfile=/var/log/sputnik.out.log

[program:stream_monitor]
command=/path/to/stream_monitor_executable
autostart=true
autorestart=true
stderr_logfile=/var/log/stream_monitor.err.log
stdout_logfile=/var/log/stream_monitor.out.log

